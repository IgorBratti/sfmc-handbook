<!-- Hero image: full-width on mobile, linked, with a meaningful alt text and a background color
     that shows while images load (or when they are blocked).
     Paste inside the 600px container of templates/base-template.html.
     Image: export at 1200px wide (2x) and display at 600px for sharp results on high-density screens. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="background-color:#dbe6f1;">
      <a href="https://example.com/offer" alias="hero_image" target="_blank" style="text-decoration:none;">
        <img src="https://image.example.com/hero-1200x600.jpg"
             width="600" height="300"
             alt="Up to 30% off on annual plans this week"
             border="0"
             style="display:block; width:100%; max-width:600px; height:auto; border:0; outline:none; text-decoration:none; font-family:Arial, Helvetica, sans-serif; font-size:18px; line-height:24px; color:#0b4f8a;">
      </a>
    </td>
  </tr>
</table>
