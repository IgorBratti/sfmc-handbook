<!-- Two columns that stack on mobile. Needs the .stack and .stack-gap classes
     from the <style> block of templates/base-template.html. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td class="stack stack-gap" width="50%" valign="top" style="padding-right:8px; font-family:Arial, Helvetica, sans-serif;">
      <p style="margin:0 0 8px 0; font-size:16px; font-weight:bold; color:#1c2128;">Left title</p>
      <p style="margin:0; font-size:14px; line-height:21px; color:#4a5560;">Left text.</p>
    </td>
    <td class="stack" width="50%" valign="top" style="padding-left:8px; font-family:Arial, Helvetica, sans-serif;">
      <p style="margin:0 0 8px 0; font-size:16px; font-weight:bold; color:#1c2128;">Right title</p>
      <p style="margin:0; font-size:14px; line-height:21px; color:#4a5560;">Right text.</p>
    </td>
  </tr>
</table>
