<!-- Image + text side by side on desktop, stacked on mobile (image on top).
     Needs the .stack and .stack-gap classes from the <style> block of templates/base-template.html.
     Outlook desktop keeps the two columns at their fixed widths thanks to the width attributes. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td class="stack stack-gap" width="200" valign="top" style="width:200px; padding-right:16px;">
      <img src="https://image.example.com/product-400x400.jpg"
           width="200" height="200" alt="Benefit card on a phone screen" border="0"
           style="display:block; width:100%; max-width:200px; height:auto; border:0; border-radius:6px;">
    </td>
    <td class="stack" valign="top" style="font-family:Arial, Helvetica, sans-serif;">
      <h2 style="margin:0 0 8px 0; font-size:20px; line-height:26px; color:#1c2128;">Your card, now in the app</h2>
      <p style="margin:0 0 16px 0; font-size:15px; line-height:23px; color:#4a5560;">Check your balance, find partner stores and block the card in seconds.</p>
      <a href="https://example.com/app" alias="image_text_cta" target="_blank"
         style="font-size:15px; font-weight:bold; color:#0b4f8a; text-decoration:underline;">Open the app</a>
    </td>
  </tr>
</table>
